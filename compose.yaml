services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_NAME:-kulai_memory}"
      POSTGRES_USER: "${DB_USER:-kulai}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-replace-me}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - kulai_postgres_data:/var/lib/postgresql/data

volumes:
  kulai_postgres_data:
