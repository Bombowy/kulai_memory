services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME must be set in backend/.env}"
      POSTGRES_USER: "${DB_USER:?DB_USER must be set in backend/.env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}"
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT must be set in backend/.env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - kulai_postgres_data:/var/lib/postgresql/data

volumes:
  kulai_postgres_data:
