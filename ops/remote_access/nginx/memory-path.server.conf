# Include ONLY inside the EXISTING HTTPS server_name demo.kulai.eu.
# Requires memory-path.http.conf in http {}. No new server, / or other project locations.
# Review the three TLS file paths and ingress DNS SAN before deployment.
# Keep invalid raw /memory targets in our location, including its safe logging.
# $request_uri remains unchanged, so the route/method allowlist returns 404.
if ($kulai_memory_v1_invalid_path = 1) { rewrite ^ /memory/ last; }

location = /memory {
    access_log off;
    error_log /dev/null emerg;
    return 404;
}

location ^~ /memory/ {
    if ($kulai_memory_v1_host_ok = 0) { return 421; }
    if ($kulai_memory_v1_sni_ok = 0) { return 421; }
    if ($kulai_memory_v1_browser = 1) { return 403; }
    if ($kulai_memory_v1_method_ok = 0) { return 404; }

    access_log /var/log/nginx/kulai-memory-path-safe.log kulai_memory_v1_safe;
    # Error logs may include request targets, headers or response data.
    error_log /dev/null emerg;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 15s;
    send_timeout 240s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_req zone=kulai_memory_v1_requests burst=20 nodelay;
    limit_req zone=kulai_memory_v1_capabilities burst=10 nodelay;
    limit_req_status 429;
    limit_conn kulai_memory_v1_connections 4;
    limit_conn_status 429;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 502 503 504 =503 @kulai_memory_v1_unavailable;

    # Trailing URI slash replaces /memory/ with /; query is preserved.
    proxy_pass https://10.77.77.2:8443/;
    proxy_bind 10.77.77.1;
    proxy_http_version 1.1;
    proxy_ssl_certificate /etc/kulai-memory/tls/gateway.pem;
    proxy_ssl_certificate_key /etc/kulai-memory/tls/gateway.key;
    proxy_ssl_trusted_certificate /etc/kulai-memory/tls/ingress-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    # Must equal the PC ingress server certificate's DNS SAN, never the public host.
    proxy_ssl_name kulai-memory-ingress;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse off;
    proxy_next_upstream off;
    proxy_next_upstream_tries 1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_ignore_client_abort off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    proxy_redirect off;
    proxy_intercept_errors on;
    proxy_pass_request_headers off;
    proxy_set_header Host demo.kulai.eu;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Kulai-Device-ID $http_x_kulai_device_id;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Upgrade $kulai_memory_v1_upgrade;
    proxy_set_header Connection $kulai_memory_v1_connection;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
}

location @kulai_memory_v1_unavailable {
    access_log /var/log/nginx/kulai-memory-path-safe.log kulai_memory_v1_safe;
    error_log /dev/null emerg;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 503 '{"detail":"Remote access unavailable."}';
}
