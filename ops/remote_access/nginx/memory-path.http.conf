# Include ONCE inside the existing http {}. No server/listener/vhost is created.
# Install alongside memory-path.server.conf after separate deployment approval.
# Unique names keep other KulAI templates and projects independent.
map $request_uri $kulai_memory_v1_route {
    default denied;
    ~^/memory/api/memories(?:\?[^\x00-\x20]*)?$ get;
    "~^/memory/api/memories/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$" get;
    ~^/memory/api/assistant/(?:ask|speech-plan)$ post;
    ~^/memory/api/pairing/(?:request|status|claim|cancel)$ capability;
    ~^/memory/api/security/refresh$ capability;
    ~^/memory/ws/(?:memory|assistant)$ websocket;
}
map "$request_method:$kulai_memory_v1_route" $kulai_memory_v1_method_ok {
    default 0;
    "GET:get" 1;
    "POST:post" 1;
    "POST:capability" 1;
    "GET:websocket" 1;
}
# Nginx selects locations using a normalized URI. Stop raw /memory traversal
# before it can select /mentor/, /propertly/ or / in the existing server.
map "$kulai_memory_v1_route:$request_uri" $kulai_memory_v1_invalid_path {
    default 0;
    ~^denied:/memory(?:/|%|\?|$) 1;
}
map $http_host $kulai_memory_v1_host_ok {
    default 0;
    demo.kulai.eu 1;
    demo.kulai.eu:443 1;
}
map $ssl_server_name $kulai_memory_v1_sni_ok { default 0; demo.kulai.eu 1; }
map "$kulai_memory_v1_route:$http_upgrade" $kulai_memory_v1_upgrade {
    default "";
    ~*^websocket:websocket$ websocket;
}
map $kulai_memory_v1_upgrade $kulai_memory_v1_connection { default close; websocket upgrade; }
map $http_origin $kulai_memory_v1_browser { default 1; "" 0; }
map $kulai_memory_v1_route $kulai_memory_v1_capability_key { default ""; capability $binary_remote_addr; }
limit_req_zone $binary_remote_addr zone=kulai_memory_v1_requests:1m rate=10r/s;
limit_req_zone $kulai_memory_v1_capability_key zone=kulai_memory_v1_capabilities:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=kulai_memory_v1_connections:1m;
log_format kulai_memory_v1_safe '$time_iso8601 status=$status bytes=$bytes_sent duration=$request_time req=$limit_req_status conn=$limit_conn_status';
