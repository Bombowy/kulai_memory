[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kulai-memory"
version = "0.1.0"
description = "Generated backend for KulAI Memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "kulai_db>=0.1.0",
    "kulai-embeddings>=0.1.0",
    "kulai-provider-ollama-embeddings>=0.1.0",
    "kulai-provider-whisper>=0.1.0",
    "kulai-transcription>=0.1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.11,<7",
    "sounddevice>=0.5.6,<1",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
